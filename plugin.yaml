name: hermes-video-editor
version: "0.3.1"
description: Local FFmpeg video editor for your own footage, driven by chat. 45 tools to trim, cut silence, crop to 9:16, add text and captions, mix music, normalize loudness, export for Reels/TikTok/YouTube and check platform rules. No cloud, no API key.
author: oliverhees
license: PolyForm-Noncommercial-1.0.0
homepage: https://lokyy.de/hermes-video-editor/

    - ve_pad_blur_background
    - ve_color_adjust
    - ve_denoise_video
    - ve_fade_video
    - ve_stabilize
    - ve_add_text
    - ve_burn_captions
    - ve_add_image_overlay
    - ve_picture_in_picture
    - ve_stack_videos
    - ve_blur_region
    - ve_extract_audio
    - ve_replace_audio
    - ve_mix_music
